<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Road to Survival</title>
    <style>
      @font-face {
        font-family: "MedievalSharp";
        src: url("/theme/fonts/MedievalSharp.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "IM Fell English";
        src: url("/theme/fonts/IMFellEnglish.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --theme-bg: #2b1f14;
        --theme-panel-bg: #3a2a1a;
        --theme-border: #4a2e1d;
        --theme-accent: #f2b705;
        --theme-accent-contrast: #2b1f14;
        --theme-text: #f2e6c9;
        --theme-text-muted: #d8c9a3;
        --theme-danger: #b0453f;
        --theme-warn: #a1791f;
        --theme-font-display: "MedievalSharp", cursive;
        --theme-font-body: "IM Fell English", Georgia, serif;
      }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--theme-bg) url("/theme/textures/parchment-background.jpg") center / 480px repeat;
        background-blend-mode: multiply;
      }
      body { font-family: var(--theme-font-body); }
      #app { display: flex; justify-content: center; align-items: center; height: 100vh; }

      /* Shared wood-textured, corner-bracketed panel look, applied directly to the room gate
         and game HUD selectors below (no new markup/classes needed). The panel-fill.png mask
         clips the wood texture to Kenney's corner-bracket silhouette instead of a plain
         rectangle. The connection banner is a full-width strip, not a discrete panel, so it
         gets a simpler wood-tiled treatment further down instead of this bracket mask. */
      .room-gate-panel, .game-hud {
        position: relative;
        border: 3px solid var(--theme-border);
        border-radius: 8px;
        color: var(--theme-text);
        font-family: var(--theme-font-body);
      }
      .room-gate-panel::before, .game-hud::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--theme-panel-bg) url("/theme/textures/wood-grain.png") center / 160px repeat;
        background-blend-mode: multiply;
        -webkit-mask-image: url("/theme/textures/panel-fill.png");
        mask-image: url("/theme/textures/panel-fill.png");
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        z-index: -1;
      }

      #room-gate {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.75);
        z-index: 10;
      }
      .room-gate-panel {
        padding: 24px;
        width: 320px;
      }
      .room-gate-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
      .room-gate-tabs button {
        flex: 1;
        padding: 8px;
        background: transparent;
        border: 1px solid var(--theme-border);
        color: var(--theme-text-muted);
        font-family: var(--theme-font-display);
        cursor: pointer;
        border-radius: 4px;
      }
      .room-gate-tabs button.active { background: var(--theme-accent); color: var(--theme-accent-contrast); border-color: var(--theme-accent); }
      .room-gate-form { display: flex; flex-direction: column; gap: 12px; }
      .room-gate-form label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
      #room-gate [hidden] { display: none !important; }
      .room-gate-form input {
        padding: 8px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--theme-border);
        color: var(--theme-text);
        font-family: var(--theme-font-body);
        border-radius: 4px;
      }
      .room-gate-form button[type="submit"] {
        padding: 10px;
        background: var(--theme-accent);
        border: none;
        border-radius: 4px;
        color: var(--theme-accent-contrast);
        font-family: var(--theme-font-display);
        font-weight: bold;
        cursor: pointer;
      }
      .room-gate-error { color: var(--theme-danger); font-size: 13px; min-height: 16px; margin: 0; }
      .room-gate-created p { font-size: 14px; }
      .room-gate-created [data-continue] {
        padding: 10px;
        width: 100%;
        background: var(--theme-accent);
        border: none;
        border-radius: 4px;
        color: var(--theme-accent-contrast);
        font-family: var(--theme-font-display);
        font-weight: bold;
        cursor: pointer;
        margin-top: 8px;
      }
      .room-gate-copy-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        font-size: 14px;
      }
      .room-gate-copy-row > span { overflow-wrap: anywhere; min-width: 0; }
      .room-gate-copy-row [data-copy] {
        flex-shrink: 0;
        padding: 5px 10px;
        background: transparent;
        border: 1px solid var(--theme-border);
        color: var(--theme-text-muted);
        cursor: pointer;
        border-radius: 4px;
        font-size: 12px;
        min-width: 52px;
      }
      .room-gate-copy-row [data-copy]:hover { background: rgba(242, 183, 5, 0.15); }

      #game-hud {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 5;
      }
      .game-hud {
        padding: 16px 20px;
        min-width: 240px;
        text-align: center;
      }
      .game-hud h2 { margin: 0 0 8px; font-size: 18px; font-family: var(--theme-font-display); }
      .game-hud p { margin: 0; font-size: 14px; color: var(--theme-text-muted); }
      .game-hud button {
        padding: 8px 16px;
        background: var(--theme-accent);
        border: none;
        border-radius: 4px;
        color: var(--theme-accent-contrast);
        font-family: var(--theme-font-display);
        font-weight: bold;
        cursor: pointer;
      }
      .game-hud button:disabled { background: #8a7454; color: var(--theme-text-muted); cursor: default; }
      .game-hud-actions { display: flex; gap: 8px; justify-content: center; }
      .game-hud-roster {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
      }
      .game-hud-roster li[data-ready="true"] { color: #8ee08e; }

      #connection-status {
        font-family: var(--theme-font-body);
      }
      .server-status-badge {
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 15;
        padding: 4px 10px;
        background: rgba(0, 0, 0, 0.6);
        color: var(--theme-text-muted);
        font-size: 11px;
        border-radius: 4px;
        pointer-events: none;
      }
      .connection-status-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: var(--theme-panel-bg) url("/theme/textures/wood-grain.png") center / 160px repeat;
        background-blend-mode: multiply;
        color: var(--theme-text);
        font-family: var(--theme-font-body);
        font-size: 14px;
        text-align: center;
        border-bottom: 3px solid var(--theme-danger);
      }
      .connection-status-banner[data-connection-status="update-available"] { border-bottom-color: var(--theme-warn); }
      .connection-status-banner button {
        padding: 6px 14px;
        background: var(--theme-accent);
        border: none;
        border-radius: 4px;
        color: var(--theme-accent-contrast);
        font-family: var(--theme-font-display);
        font-weight: bold;
        cursor: pointer;
      }

      #credits {
        font-family: var(--theme-font-body);
      }
      .credits-widget {
        position: fixed;
        bottom: 8px;
        right: 8px;
        z-index: 15;
      }
      .credits-trigger {
        padding: 4px 10px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid var(--theme-border);
        color: var(--theme-text-muted);
        font-family: var(--theme-font-body);
        font-size: 11px;
        border-radius: 4px;
        cursor: pointer;
      }
      .credits-trigger:hover { color: var(--theme-text); }
      .credits-panel {
        position: absolute;
        bottom: 100%;
        right: 0;
        margin-bottom: 8px;
        width: 260px;
        padding: 14px 16px;
        background: var(--theme-panel-bg);
        border: 1px solid var(--theme-border);
        border-radius: 6px;
        color: var(--theme-text);
        font-size: 13px;
      }
      .credits-panel h3 { margin: 0 0 8px; font-size: 15px; font-family: var(--theme-font-display); }
      .credits-panel ul { margin: 0; padding-left: 18px; }
      .credits-panel li { margin-bottom: 4px; }
      .credits-panel a { color: var(--theme-accent); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
