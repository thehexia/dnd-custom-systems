<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Road to Survival</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111; }
      #app { display: flex; justify-content: center; align-items: center; height: 100vh; }

      #room-gate {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.75);
        font-family: system-ui, sans-serif;
        color: #eee;
        z-index: 10;
      }
      .room-gate-panel {
        background: #1d1d1d;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 24px;
        width: 320px;
      }
      .room-gate-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
      .room-gate-tabs button {
        flex: 1;
        padding: 8px;
        background: #2a2a2a;
        border: 1px solid #444;
        color: #ccc;
        cursor: pointer;
        border-radius: 4px;
      }
      .room-gate-tabs button.active { background: #3ddc97; color: #111; border-color: #3ddc97; }
      .room-gate-form { display: flex; flex-direction: column; gap: 12px; }
      .room-gate-form label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
      #room-gate [hidden] { display: none !important; }
      .room-gate-form input {
        padding: 8px;
        background: #111;
        border: 1px solid #444;
        color: #eee;
        border-radius: 4px;
      }
      .room-gate-form button[type="submit"] {
        padding: 10px;
        background: #3ddc97;
        border: none;
        border-radius: 4px;
        color: #111;
        font-weight: bold;
        cursor: pointer;
      }
      .room-gate-error { color: #f25f5c; font-size: 13px; min-height: 16px; margin: 0; }
      .room-gate-created p { font-size: 14px; }
      .room-gate-created [data-continue] {
        padding: 10px;
        width: 100%;
        background: #3ddc97;
        border: none;
        border-radius: 4px;
        color: #111;
        font-weight: bold;
        cursor: pointer;
        margin-top: 8px;
      }
      .room-gate-copy-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        font-size: 14px;
      }
      .room-gate-copy-row > span { overflow-wrap: anywhere; min-width: 0; }
      .room-gate-copy-row [data-copy] {
        flex-shrink: 0;
        padding: 5px 10px;
        background: #2a2a2a;
        border: 1px solid #444;
        color: #ccc;
        cursor: pointer;
        border-radius: 4px;
        font-size: 12px;
        min-width: 52px;
      }
      .room-gate-copy-row [data-copy]:hover { background: #333; }

      #game-hud {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 5;
        font-family: system-ui, sans-serif;
        color: #f2e6c9;
      }
      .game-hud {
        background: rgba(43, 31, 20, 0.92);
        border: 1px solid #4a2e1d;
        border-radius: 8px;
        padding: 16px 20px;
        min-width: 240px;
        text-align: center;
      }
      .game-hud h2 { margin: 0 0 8px; font-size: 16px; }
      .game-hud p { margin: 0; font-size: 14px; color: #d8c9a3; }
      .game-hud button {
        padding: 8px 16px;
        background: #f2b705;
        border: none;
        border-radius: 4px;
        color: #2b1f14;
        font-weight: bold;
        cursor: pointer;
      }
      .game-hud button:disabled { background: #8a7454; color: #d8c9a3; cursor: default; }
      .game-hud-actions { display: flex; gap: 8px; justify-content: center; }
      .game-hud-roster {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
      }
      .game-hud-roster li[data-ready="true"] { color: #8ee08e; }

      #connection-status {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        font-family: system-ui, sans-serif;
      }
      .connection-status-banner {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #7a2e2e;
        color: #fceee6;
        font-size: 14px;
        text-align: center;
      }
      .connection-status-banner[data-connection-status="update-available"] { background: #7a5a1a; }
      .connection-status-banner button {
        padding: 6px 14px;
        background: #fceee6;
        border: none;
        border-radius: 4px;
        color: #2b1f14;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
